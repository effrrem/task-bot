<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Мои задачи</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="cal-header">
      <div class="cal-title">
        <span class="cal-title-month" id="monthLabel">Загрузка…</span>
      </div>
      <div class="cal-nav">
        <button class="nav-btn" id="prevBtn" aria-label="Предыдущий месяц">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="nav-btn today-btn" id="todayBtn">Сегодня</button>
        <button class="nav-btn" id="nextBtn" aria-label="Следующий месяц">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="cal-wrap">
      <div class="wk-row" id="weekRow"></div>
      <div class="cal-grid" id="calendar"></div>
    </div>

    <section class="tasks-panel">
      <div class="tasks-title" id="tasksTitle">Задачи</div>
      <div class="tasks-list" id="tasksList"></div>
    </section>

    <footer class="app-footer" id="appFooter">Новые задачи добавляй прямо в чате бота 📝</footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
